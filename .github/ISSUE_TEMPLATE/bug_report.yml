name: Bug Report
description: Report a bug or unexpected behavior.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please provide as much detail as possible.

  - type: textarea
    id: what-happened
    attributes:
      label: Describe the bug
      description: A clear description of what the bug is and what you expected to happen.
      placeholder: "Example: When I click on a marker, the popup does not appear."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Which browser are you using? (e.g., Chrome, Firefox, Safari)
      placeholder: "Chrome"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: If applicable, add screenshots or paste console logs here.
    validations:
      required: false
